name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Flutter verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Install the pinned Flutter SDK
        shell: bash
        run: |
          git clone --depth 1 --branch "$(cat .flutter-version)" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Format, analyze, test, enforce coverage and build web
        id: verify
        run: python tool/verify.py --web
      - name: Require complete reports and build output
        run: |
          test -s coverage/lcov.info
          test -s reports/coverage.html
          test -s reports/coverage-summary.txt
          test -s build/web/index.html
      - name: Upload coverage report
        if: ${{ !cancelled() && (steps.verify.outcome == 'success' || hashFiles('coverage/lcov.info', 'reports/coverage.html', 'reports/coverage-summary.txt') != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: |
            coverage/lcov.info
            reports/coverage.html
            reports/coverage-summary.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload web build
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: meditrack-web
          path: build/web/
          if-no-files-found: error
          retention-days: 14
