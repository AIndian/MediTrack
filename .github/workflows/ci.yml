name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install the pinned Flutter SDK
        shell: bash
        run: |
          git clone --depth 1 --branch "$(cat .flutter-version)" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Format, analyze, test, enforce coverage and build web
        run: python tool/verify.py --web
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/lcov.info
            reports/coverage.html
            reports/coverage-summary.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: meditrack-web
          path: build/web/
          if-no-files-found: error
          retention-days: 14

  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v7
        with:
          name: meditrack-web
          path: build/web
      - run: npm ci
        working-directory: react
      - run: npx playwright install --with-deps chromium
        working-directory: react
      - run: npm run test:e2e:flutter
        working-directory: react
      - name: Upload Flutter browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: meditrack-flutter-browser
          path: |
            react/playwright-flutter-report/
            react/test-results-flutter/
          retention-days: 14
